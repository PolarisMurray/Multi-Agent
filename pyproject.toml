[project]
name = "bitguide-multi-agent"
version = "0.1.0"
description = "Configuration-driven multi-agent platform with a graph workflow engine"
requires-python = ">= 3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
bitguide = "bitguide.cli:main"

[project.optional-dependencies]
redis = [
    "redis>=8.1.0",
]
milvus = [
    "pymilvus[milvus-lite]>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitguide"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["bitguide"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "mcp_servers", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "ruff>=0.16.10",
]
